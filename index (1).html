<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<style>
:root{--bg:#050a07;--card:rgba(255,255,255,.05);--bd:rgba(120,255,190,.18);--tx:#e8f5ee;--mu:#9db3a8;--ac:#00ff9f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 70% 0,rgba(0,255,159,.12),transparent),var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",system-ui,sans-serif}
main{width:min(520px,100%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:1.5rem}
p{color:var(--mu);margin:0 0 18px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:#07110b;color:var(--tx);font:inherit}
button{padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.meter{height:10px;border-radius:8px;background:rgba(255,255,255,.08);margin:18px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.label{display:flex;justify-content:space-between;font-weight:600}
ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:6px;color:var(--mu);font-size:.95rem}
li::before{content:"✗ ";color:#f87171}
li.ok{color:var(--ac)}
li.ok::before{content:"✓ ";color:var(--ac)}
a{color:var(--ac)}
small{display:block;margin-top:18px;color:var(--mu)}
</style>
</head>
<body>
<main>
  <h1>Password Strength Checker</h1>
  <p>Type a password to see how strong it is. Everything runs in your browser; nothing is sent or saved.</p>
  <div class="row">
    <input id="pw" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
    <button id="show" type="button" aria-pressed="false">Show</button>
  </div>
  <div class="meter" aria-hidden="true"><i id="bar"></i></div>
  <div class="label"><span id="verdict" aria-live="polite">Enter a password</span><span id="bits"></span></div>
  <ul id="rules"></ul>
  <small>Tip: a long passphrase of random words beats a short, complicated password. <a href="../../index.html">&larr; Back to portfolio</a></small>
</main>
<script>
(() => {
  const COMMON = ['password', '123456', '12345678', 'qwerty', 'abc123', 'letmein', 'admin', 'welcome', 'iloveyou', '111111', 'dragon', 'monkey', 'football'];
  const RULES = [
    ['At least 12 characters', p => p.length >= 12],
    ['Upper and lower case letters', p => /[a-z]/.test(p) && /[A-Z]/.test(p)],
    ['At least one number', p => /\d/.test(p)],
    ['At least one symbol', p => /[^A-Za-z0-9]/.test(p)],
    ['Not a common password', p => p.length > 0 && !COMMON.some(c => p.toLowerCase().includes(c))],
    ['No long repeated characters (aaa)', p => p.length > 0 && !/(.)\1{2,}/.test(p)]
  ];
  const LEVELS = [[28, 'Very weak', '#ef4444'], [36, 'Weak', '#f97316'], [60, 'Fair', '#eab308'], [80, 'Strong', '#84cc16'], [Infinity, 'Very strong', '#00ff9f']];
  const $ = id => document.getElementById(id);
  const pw = $('pw'), list = $('rules');
  RULES.forEach(([text]) => { const li = document.createElement('li'); li.textContent = text; list.appendChild(li); });

  // Rough entropy estimate: length x log2(size of the character pool)
  const entropy = p => {
    let pool = 0;
    if (/[a-z]/.test(p)) pool += 26;
    if (/[A-Z]/.test(p)) pool += 26;
    if (/\d/.test(p)) pool += 10;
    if (/[^A-Za-z0-9]/.test(p)) pool += 33;
    return pool ? Math.round(p.length * Math.log2(pool)) : 0;
  };
  const update = () => {
    const p = pw.value, results = RULES.map(([, test]) => test(p));
    [...list.children].forEach((li, i) => li.classList.toggle('ok', results[i]));
    let bits = entropy(p);
    if (!results[4] || !results[5]) bits = Math.min(bits, 27); // common or repetitive passwords are weak whatever their length
    const [, name, color] = LEVELS.find(l => bits < l[0]);
    $('bar').style.width = p ? Math.min(100, (bits / 80) * 100) + '%' : '0';
    $('bar').style.background = color;
    $('verdict').textContent = p ? name : 'Enter a password';
    $('bits').textContent = p ? '~' + bits + ' bits' : '';
  };
  pw.addEventListener('input', update);
  $('show').addEventListener('click', e => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.target.textContent = show ? 'Hide' : 'Show';
    e.target.setAttribute('aria-pressed', show);
  });
})();
</script>
</body>
</html>
